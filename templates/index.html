<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF → Study Plan</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #1a1a1a;
      color: #fff;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.2rem; font-weight: 600; letter-spacing: -0.3px; }
    header span { font-size: 1.4rem; }

    /* ── Layout ── */
    .page { max-width: 860px; margin: 40px auto; padding: 0 20px 80px; }

    /* ── Card ── */
    .card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e0e0e0;
      padding: 28px 32px;
      margin-bottom: 24px;
    }
    .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 18px; color: #444; }

    /* ── Drop zone ── */
    #dropZone {
      border: 2px dashed #ccc;
      border-radius: 10px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    #dropZone:hover, #dropZone.drag-over {
      border-color: #4f46e5;
      background: #f0f0ff;
    }
    #dropZone .icon { font-size: 2.4rem; margin-bottom: 10px; }
    #dropZone p { color: #666; font-size: 0.9rem; line-height: 1.6; }
    #dropZone strong { color: #4f46e5; cursor: pointer; }
    #dropZone strong:hover { text-decoration: underline; }

    #fileInfo {
      margin-top: 14px;
      display: none;
      align-items: center;
      gap: 10px;
      background: #f0f0ff;
      border: 1px solid #c7c7ff;
      border-radius: 8px;
      padding: 10px 14px;
    }
    #fileInfo .file-icon { font-size: 1.3rem; }
    #fileInfo .file-name { font-size: 0.88rem; font-weight: 500; color: #333; flex: 1; }
    #fileInfo .remove-btn {
      background: none; border: none; cursor: pointer;
      font-size: 1rem; color: #999; padding: 0 4px;
    }
    #fileInfo .remove-btn:hover { color: #e53e3e; }

    /* ── Button ── */
    #processBtn {
      display: block; width: 100%; margin-top: 20px;
      background: #4f46e5; color: #fff;
      border: none; border-radius: 8px;
      padding: 13px; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s, opacity 0.2s;
    }
    #processBtn:hover:not(:disabled) { background: #4338ca; }
    #processBtn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Loading ── */
    #loading {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }
    .spinner {
      width: 40px; height: 40px; margin: 0 auto 16px;
      border: 3px solid #e0e0e0;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { color: #666; font-size: 0.9rem; }

    /* ── Error ── */
    #errorBox {
      display: none;
      background: #fff5f5; border: 1px solid #fed7d7;
      border-radius: 8px; padding: 14px 18px;
      color: #c53030; font-size: 0.88rem;
      white-space: pre-wrap;
    }

    /* ── Stats bar ── */
    #statsBar {
      display: none;
      gap: 0;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 0;
    }
    .stat {
      flex: 1; padding: 14px 20px;
      border-right: 1px solid #e0e0e0;
      text-align: center;
    }
    .stat:last-child { border-right: none; }
    .stat .num { font-size: 1.6rem; font-weight: 700; color: #4f46e5; }
    .stat .lbl { font-size: 0.75rem; color: #888; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: 4px;
      margin: 20px 0 0;
      border-bottom: 2px solid #f0f0f0;
    }
    .tab-btn {
      background: none; border: none; cursor: pointer;
      padding: 9px 20px; font-size: 0.88rem; font-weight: 600;
      color: #888; border-bottom: 2px solid transparent;
      margin-bottom: -2px; transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn:hover { color: #4f46e5; }
    .tab-btn.active { color: #4f46e5; border-bottom-color: #4f46e5; }
    .tab-content { padding-top: 20px; }

    /* ── Download ── */
    #downloadBtn {
      display: none;
      float: right;
      background: #f0f0ff;
      color: #4f46e5;
      border: 1px solid #c7c7ff;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 12px;
    }
    #downloadBtn:hover { background: #e0e0ff; }

    /* ── Markdown output ── */
    #mdOutput {
      line-height: 1.75;
      font-size: 0.92rem;
      color: #222;
      clear: both;
    }
    #mdOutput h1 { font-size: 1.4rem; margin-bottom: 6px; }
    #mdOutput h2 { font-size: 1.15rem; margin: 28px 0 10px; padding-bottom: 6px; border-bottom: 2px solid #f0f0f0; color: #333; }
    #mdOutput h3 { font-size: 1rem; margin: 20px 0 8px; color: #4f46e5; }
    #mdOutput h4 { font-size: 0.92rem; font-weight: 700; margin: 16px 0 6px; color: #1a1a1a; }
    #mdOutput p { margin-bottom: 8px; }
    #mdOutput blockquote {
      border-left: 3px solid #4f46e5; margin: 8px 0 12px;
      padding: 6px 14px; background: #f8f8ff; color: #333;
      border-radius: 0 6px 6px 0; font-style: italic;
    }
    #mdOutput ul { margin: 6px 0 10px 18px; }
    #mdOutput li { margin-bottom: 4px; }
    #mdOutput strong { color: #111; }
    #mdOutput em { color: #666; font-size: 0.88rem; }
    #mdOutput hr { border: none; border-top: 1px solid #eee; margin: 20px 0; }

    /* ── Graph legend ── */
    #graphLegend {
      display: flex;
      gap: 18px;
      margin-bottom: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #444;
    }
    .legend-dot {
      width: 13px; height: 13px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .legend-hint {
      margin-left: auto;
      font-size: 0.78rem;
      color: #aaa;
      font-style: italic;
    }

    /* ── Graph container ── */
    #graphWrapper {
      overflow: auto;
      border-radius: 10px;
      background: #f0f3ff;
    }
    #graphContainer {
      position: relative;
      background: #f0f3ff;
    }
    #graphSvg {
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
      overflow: visible;
    }
    .gnode {
      position: absolute;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
      text-align: center;
      padding: 6px 10px;
      cursor: default;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      line-height: 1.3;
      transition: transform 0.15s, box-shadow 0.15s;
      user-select: none;
    }

    /* ── Tooltip ── */
    #nodeTooltip {
      display: none;
      position: fixed;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 14px 18px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.12);
      max-width: 300px;
      z-index: 9999;
      pointer-events: none;
    }
    #tooltipTitle {
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 10px;
      color: #1a1a1a;
    }
    #tooltipList {
      margin: 0;
      padding-left: 16px;
      list-style: disc;
    }
    #tooltipList li {
      margin-bottom: 6px;
      font-size: 0.82rem;
      color: #333;
    }
    #tooltipList li span {
      color: #666;
      font-size: 0.79rem;
      display: block;
      margin-top: 2px;
    }
  </style>
</head>
<body>

<header>
  <span>📚</span>
  <h1>PDF → Study Plan</h1>
</header>

<div class="page">

  <!-- Upload card -->
  <div class="card">
    <h2>Upload a PDF</h2>

    <div id="dropZone">
      <div class="icon">📄</div>
      <p>Drag &amp; drop your PDF here, or <strong id="browseLink">browse</strong></p>
      <p style="margin-top:6px; font-size:0.8rem; color:#aaa;">Max 50 MB</p>
    </div>
    <input type="file" id="pdfInput" accept=".pdf" style="display:none" />

    <div id="fileInfo">
      <span class="file-icon">📄</span>
      <span class="file-name" id="fileName"></span>
      <button class="remove-btn" id="removeFile" title="Remove">✕</button>
    </div>

    <button id="processBtn" disabled style="margin-top:20px;">Generate Study Plan</button>
  </div>

  <!-- Loading -->
  <div id="loading">
    <div class="spinner"></div>
    <p id="loadingMsg">Processing your PDF…</p>
  </div>

  <!-- Error -->
  <div id="errorBox"></div>

  <!-- Results -->
  <div class="card" id="resultsCard" style="display:none">

    <!-- Stats bar -->
    <div id="statsBar" style="display:flex">
      <div class="stat"><div class="num" id="statPages">—</div><div class="lbl">Pages</div></div>
      <div class="stat"><div class="num" id="statTopics">—</div><div class="lbl">Topics</div></div>
      <div class="stat"><div class="num" id="statConcepts">—</div><div class="lbl">Subtopics</div></div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="plan">Study Plan</button>
      <button class="tab-btn"        data-tab="graph">Knowledge Graph</button>
    </div>

    <!-- Study Plan tab -->
    <div id="tabPlan" class="tab-content">
      <a id="downloadBtn" download="study_plan.md">⬇ Download study_plan.md</a>
      <div id="mdOutput"></div>
    </div>

    <!-- Knowledge Graph tab -->
    <div id="tabGraph" class="tab-content" style="display:none">
      <div id="graphLegend">
        <span class="legend-item">
          <span class="legend-dot" style="background:#6fcf97"></span>Easy
        </span>
        <span class="legend-item">
          <span class="legend-dot" style="background:#f2c94c"></span>Medium
        </span>
        <span class="legend-item">
          <span class="legend-dot" style="background:#eb5757"></span>Hard
        </span>
        <span class="legend-hint">Hover a node to see subtopics</span>
      </div>
      <div id="graphWrapper">
        <div id="graphContainer">
          <svg id="graphSvg"></svg>
        </div>
      </div>
    </div>

  </div><!-- /resultsCard -->

</div><!-- /page -->

<!-- Tooltip (fixed position, outside card flow) -->
<div id="nodeTooltip">
  <div id="tooltipTitle"></div>
  <ul id="tooltipList"></ul>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  // ── Element refs ──────────────────────────────────────────────────────────────
  const dropZone    = document.getElementById("dropZone");
  const pdfInput    = document.getElementById("pdfInput");
  const browseLink  = document.getElementById("browseLink");
  const fileInfo    = document.getElementById("fileInfo");
  const fileName    = document.getElementById("fileName");
  const removeFile  = document.getElementById("removeFile");
  const processBtn  = document.getElementById("processBtn");
  const loading     = document.getElementById("loading");
  const errorBox    = document.getElementById("errorBox");
  const resultsCard = document.getElementById("resultsCard");
  const statsBar    = document.getElementById("statsBar");
  const downloadBtn = document.getElementById("downloadBtn");
  const mdOutput    = document.getElementById("mdOutput");
  const tooltip     = document.getElementById("nodeTooltip");

  let selectedFile     = null;
  let currentGraphData = null;

  // ── File selection ────────────────────────────────────────────────────────────
  browseLink.addEventListener("click", () => pdfInput.click());
  pdfInput.addEventListener("change", () => {
    if (pdfInput.files[0]) setFile(pdfInput.files[0]);
  });

  removeFile.addEventListener("click", () => {
    selectedFile = null;
    pdfInput.value = "";
    fileInfo.style.display = "none";
    dropZone.style.display = "block";
    processBtn.disabled = true;
  });

  // ── Drag & drop ───────────────────────────────────────────────────────────────
  dropZone.addEventListener("dragover",  e => { e.preventDefault(); dropZone.classList.add("drag-over"); });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag-over"));
  dropZone.addEventListener("drop", e => {
    e.preventDefault();
    dropZone.classList.remove("drag-over");
    const f = e.dataTransfer.files[0];
    if (f && f.name.toLowerCase().endsWith(".pdf")) setFile(f);
    else showError("Please drop a PDF file.");
  });

  function setFile(f) {
    selectedFile = f;
    fileName.textContent = f.name;
    fileInfo.style.display = "flex";
    dropZone.style.display = "none";
    processBtn.disabled = false;
    hideError();
    hideResults();
  }

  // ── Process ──────────────────────────────────────────────────────────────────
  processBtn.addEventListener("click", async () => {
    if (!selectedFile) return;

    showLoading();
    hideError();
    hideResults();

    const form = new FormData();
    form.append("pdf", selectedFile);

    try {
      const res  = await fetch("/api/extract", { method: "POST", body: form });
      const data = await res.json();

      if (!res.ok || data.error) {
        showError(data.error || "An unexpected error occurred.");
        return;
      }

      showResults(data);
    } catch (err) {
      showError("Network error — is the server running?\n" + err.message);
    } finally {
      hideLoading();
    }
  });

  // ── UI helpers ────────────────────────────────────────────────────────────────
  function showLoading() {
    loading.style.display = "block";
    processBtn.disabled = true;
  }
  function hideLoading() {
    loading.style.display = "none";
    processBtn.disabled = false;
  }

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = "block";
  }
  function hideError() { errorBox.style.display = "none"; }

  function showResults(data) {
    document.getElementById("statPages").textContent    = data.pages_processed;
    document.getElementById("statTopics").textContent   = data.topics_count;
    document.getElementById("statConcepts").textContent = data.subtopics_count;
    statsBar.style.display = "flex";

    mdOutput.innerHTML = marked.parse(data.markdown);

    const blob = new Blob([data.markdown], { type: "text/markdown" });
    downloadBtn.href = URL.createObjectURL(blob);
    downloadBtn.style.display = "inline-block";

    currentGraphData = data.graph || null;

    resultsCard.style.display = "block";
    switchTab("plan");
    resultsCard.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function hideResults() {
    resultsCard.style.display = "none";
    currentGraphData = null;
  }

  // ── Tabs ──────────────────────────────────────────────────────────────────────
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => switchTab(btn.dataset.tab));
  });

  function switchTab(name) {
    document.querySelectorAll(".tab-btn").forEach(b =>
      b.classList.toggle("active", b.dataset.tab === name)
    );
    document.getElementById("tabPlan").style.display  = name === "plan"  ? "block" : "none";
    document.getElementById("tabGraph").style.display = name === "graph" ? "block" : "none";
    if (name === "graph") renderGraph(currentGraphData);
  }

  // ── Knowledge Graph ───────────────────────────────────────────────────────────
  const DIFF_COLORS = { easy: "#6fcf97", medium: "#f2c94c", hard: "#eb5757" };
  const NODE_W = 155, NODE_H = 56, GAP_X = 22, GAP_Y = 88, PAD = 32;

  function renderGraph(graphData) {
    const container = document.getElementById("graphContainer");
    const svg       = document.getElementById("graphSvg");

    container.querySelectorAll(".gnode").forEach(el => el.remove());
    svg.innerHTML = "";

    if (!graphData || !graphData.nodes || graphData.nodes.length === 0) {
      container.style.width  = "100%";
      container.style.height = "120px";
      container.innerHTML   += '<p style="text-align:center;padding:40px;color:#aaa;font-size:0.9rem">No graph data.</p>';
      return;
    }

    const { nodes, edges } = graphData;

    // ── Topological tiers via BFS ──
    const inDeg = Object.fromEntries(nodes.map(n => [n.id, 0]));
    const adj   = Object.fromEntries(nodes.map(n => [n.id, []]));
    edges.forEach(e => { inDeg[e.to_id]++; adj[e.from_id].push(e.to_id); });

    const tierOf  = {};
    const visited = new Set();
    let frontier  = nodes.filter(n => inDeg[n.id] === 0).map(n => n.id);
    if (!frontier.length) frontier = [nodes[0].id]; // cycle fallback

    let tier = 0;
    while (frontier.length) {
      frontier.forEach(id => { if (!(id in tierOf)) { tierOf[id] = tier; visited.add(id); } });
      const next = new Set();
      frontier.forEach(id => adj[id].forEach(nb => { if (!visited.has(nb)) next.add(nb); }));
      frontier = [...next];
      tier++;
    }
    nodes.forEach(n => { if (!(n.id in tierOf)) tierOf[n.id] = tier++; });

    // ── Group nodes by tier ──
    const groups = {};
    nodes.forEach(n => {
      const t = tierOf[n.id] ?? 0;
      if (!groups[t]) groups[t] = [];
      groups[t].push(n);
    });

    const numTiers  = Object.keys(groups).length;
    const maxPerRow = Math.max(...Object.values(groups).map(g => g.length));
    const svgW = PAD * 2 + maxPerRow * NODE_W + (maxPerRow - 1) * GAP_X;
    const svgH = PAD * 2 + numTiers  * NODE_H + (numTiers  - 1) * GAP_Y;

    container.style.width  = svgW + "px";
    container.style.height = svgH + "px";
    svg.setAttribute("width",   svgW);
    svg.setAttribute("height",  svgH);
    svg.setAttribute("viewBox", `0 0 ${svgW} ${svgH}`);

    // Arrowhead marker
    const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
    defs.innerHTML = `<marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b0b0c0"/>
    </marker>`;
    svg.appendChild(defs);

    // ── Compute node positions ──
    const pos = {};
    Object.entries(groups)
      .sort((a, b) => +a[0] - +b[0])
      .forEach(([t, tNodes]) => {
        const y    = PAD + parseInt(t) * (NODE_H + GAP_Y);
        const rowW = tNodes.length * NODE_W + (tNodes.length - 1) * GAP_X;
        const x0   = (svgW - rowW) / 2;
        tNodes.forEach((n, i) => {
          const x = x0 + i * (NODE_W + GAP_X);
          pos[n.id] = { x, y, cx: x + NODE_W / 2, cy: y + NODE_H / 2 };
        });
      });

    // ── Draw edges ──
    edges.forEach(e => {
      const a = pos[e.from_id], b = pos[e.to_id];
      if (!a || !b) return;
      const x1 = a.cx, y1 = a.y + NODE_H;
      const x2 = b.cx, y2 = b.y;
      const midY = (y1 + y2) / 2;
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", `M${x1},${y1} C${x1},${midY} ${x2},${midY} ${x2},${y2}`);
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", "#c0c0d0");
      path.setAttribute("stroke-width", "1.8");
      path.setAttribute("marker-end", "url(#arr)");
      svg.appendChild(path);
    });

    // ── Draw nodes ──
    nodes.forEach(n => {
      const p = pos[n.id];
      if (!p) return;

      const el = document.createElement("div");
      el.className        = "gnode";
      el.style.left       = p.x + "px";
      el.style.top        = p.y + "px";
      el.style.width      = NODE_W + "px";
      el.style.height     = NODE_H + "px";
      el.style.background = DIFF_COLORS[n.difficulty] || "#ddd";
      el.textContent      = n.label.length > 26 ? n.label.slice(0, 24) + "…" : n.label;

      el.addEventListener("mouseenter", evt => {
        el.style.transform = "scale(1.07)";
        el.style.boxShadow = "0 4px 18px rgba(0,0,0,0.18)";
        document.getElementById("tooltipTitle").textContent = n.label;
        const list = document.getElementById("tooltipList");
        list.innerHTML = (n.subtopics || []).map(st =>
          `<li><strong>${escHtml(st.name)}</strong>${
            st.notes ? `<span>${escHtml(st.notes)}</span>` : ""
          }</li>`
        ).join("");
        tooltip.style.display = "block";
        positionTooltip(evt);
      });
      el.addEventListener("mousemove",  positionTooltip);
      el.addEventListener("mouseleave", () => {
        el.style.transform = "";
        el.style.boxShadow = "0 2px 6px rgba(0,0,0,0.1)";
        tooltip.style.display = "none";
      });

      container.appendChild(el);
    });
  }

  function positionTooltip(evt) {
    const x  = evt.clientX + 16;
    const y  = evt.clientY - 10;
    const tw = tooltip.offsetWidth  || 0;
    const th = tooltip.offsetHeight || 0;
    tooltip.style.left = Math.min(x, window.innerWidth  - tw - 12) + "px";
    tooltip.style.top  = Math.max(8, Math.min(y, window.innerHeight - th - 8)) + "px";
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }
</script>
</body>
</html>
